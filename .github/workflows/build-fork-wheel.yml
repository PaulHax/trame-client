name: Build Fork Wheel

on:
  push:
    branches: [shared-context]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Vue2 App
        run: |
          cd vue2-app
          npm ci
          npm run build

      - name: Build Vue3 App
        run: |
          cd vue3-app
          npm ci
          npm run build

      - name: Build wheel
        run: pip install build && python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: trame-client-fork-wheel
          path: dist/*.whl

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || format('v{0}-fork', github.run_number) }}
          files: dist/*.whl
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
